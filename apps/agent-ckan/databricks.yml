bundle:
  name: agent_langgraph

variables:
  warehouse_id:
    description: SQL warehouse the lookup_staff tool uses to query the staff Delta table
    default: fd56ab2d2aa39315

resources:
  apps:
    agent_langgraph:
      name: "agent-ckan"
      description: "LangGraph agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: "sql-warehouse"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "3420519905521099"
            permission: 'CAN_MANAGE'
        - name: 'sql-warehouse'
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: 'CAN_USE'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph:
          name: agent-langgraph
